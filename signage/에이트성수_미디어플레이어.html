<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EIGHT Signage</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  .layer{position:absolute;inset:0;opacity:0;transition:opacity .6s ease}
  .layer.on{opacity:1}
  .layer img,.layer video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
  .layer .cover{object-fit:cover}
  #dbg{position:fixed;left:8px;bottom:8px;z-index:9;display:none;white-space:pre;
       color:#0f0;font:14px/1.4 monospace;background:rgba(0,0,0,.65);padding:6px 10px}
  #msg{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;
       padding:40px;text-align:center;white-space:pre-line;color:#fff;font:600 28px/1.5 sans-serif}
</style>
</head>
<body>
<div id="A" class="layer"></div>
<div id="B" class="layer"></div>
<div id="dbg"></div>
<div id="msg"></div>
<script>
(() => {
  // ── 설정 ─────────────────────────────────────────
  const qs = new URLSearchParams(location.search);
  const PLAYLIST_URL = qs.get('playlist') || 'playlist.js'; // 콘텐츠 목록
  const DEBUG = qs.has('debug');           // ?debug 붙이면 화면 좌하단에 상태 표시
  const POLL_MS = 30 * 1000;               // 플레이리스트 변경 확인 주기
  const CLOCK_SYNC_MS = 10 * 60 * 1000;    // 서버 시계 보정 주기
  const RELOAD_MS = 6 * 60 * 60 * 1000;    // 장시간 구동 대비 자동 새로고침
  const TICK_MS = 250, FADE_MS = 600, PRELOAD_MS = 4000;

  // ── 상태 ─────────────────────────────────────────
  let offset = 0;                 // 서버시각 - 기기시각 (ms)
  let items = [], cycle = 0, sig = '';
  let curIdx = null, prepared = null, lastSwitch = 0;
  let front = document.getElementById('A'), back = document.getElementById('B');
  const dbg = document.getElementById('dbg');
  if (DEBUG) dbg.style.display = 'block';
  const now = () => Date.now() + offset;
  const bust = (u, k) => u + (u.includes('?') ? '&' : '?') + k + '=' + Date.now();

  // 서버 응답의 Date 헤더가 다음 초로 넘어가는 순간을 잡아 기기 시계를 보정
  async function syncClock() {
    if (location.protocol === 'file:') return; // PC에서 바로 열 땐 기기 시계 사용
    const self = location.pathname || '/';
    let prev = null;
    for (let i = 0; i < 40; i++) {
      const t0 = Date.now();
      let d;
      try {
        const r = await fetch(bust(self, 't'), { method: 'HEAD', cache: 'no-store' });
        d = r.headers.get('date');
      } catch (e) { return; }
      const t1 = Date.now();
      if (!d) return;
      const s = Date.parse(d);
      if (prev !== null && s !== prev && (t1 - t0) < 400) {
        offset = Math.round(s - (t0 + t1) / 2);
        return;
      }
      prev = s;
      await new Promise(r => setTimeout(r, 60));
    }
  }

  // playlist.js 를 <script>로 불러옴 → PC에서 파일을 바로 열어도(file://) 동작
  function loadScript(url) {
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = bust(url, 'v');
      s.onload = () => { s.remove(); res(); };
      s.onerror = () => { s.remove(); rej(new Error('load ' + url)); };
      document.head.appendChild(s);
    });
  }

  async function loadPlaylist() {
    try {
      try { await loadScript(PLAYLIST_URL); }
      catch (e) { if (!window.PLAYLIST) throw e; } // 페이지에 목록이 내장된 경우 그대로 사용
      const j = window.PLAYLIST;
      if (!j) { notice('playlist.js 안에 PLAYLIST 가 없습니다'); return; }
      const txt = JSON.stringify(j);
      if (txt === sig) return;
      const list = (Array.isArray(j) ? j : j.items || [])
        .filter(x => x && x.src && Number(x.duration) > 0);
      if (!list.length) { notice('재생할 콘텐츠가 없습니다 (playlist.js 확인)'); return; }
      sig = txt;
      items = list;
      cycle = list.reduce((a, x) => a + Number(x.duration) * 1000, 0);
      curIdx = null; prepared = null;   // 새 목록으로 즉시 다시 그림
      notice('');
    } catch (e) {
      console.warn('playlist', e);
      if (!items.length) notice('playlist.js 를 찾을 수 없습니다 (index.html 과 같은 폴더에 있어야 함)');
    }
  }

  // 화면이 비었을 때 이유를 표시 (콘텐츠 정상 재생 시 숨김)
  const msg = document.getElementById('msg');
  function notice(t) { msg.textContent = t; msg.style.display = t ? 'flex' : 'none'; }
  const missing = new Set();

  // 모든 기기가 같은 기준(1970-01-01)에서 계산 → 같은 시각엔 같은 장면
  function locate(t) {
    let p = ((t % cycle) + cycle) % cycle;
    for (let i = 0; i < items.length; i++) {
      const d = Number(items[i].duration) * 1000;
      if (p < d) return { i, into: p, left: d - p };
      p -= d;
    }
    return { i: 0, into: 0, left: 0 };
  }

  function makeEl(it) {
    let el;
    if (it.type === 'video' || /\.(mp4|webm|mov)(\?|$)/i.test(it.src)) {
      el = document.createElement('video');
      el.muted = true; el.defaultMuted = true; el.setAttribute('muted', '');
      el.playsInline = true; el.setAttribute('playsinline', '');
      el.preload = 'auto';
      el.src = it.src;
    } else {
      el = new Image();
      el.decoding = 'async';
      el.src = it.src;
    }
    if (it.fit === 'cover') el.className = 'cover';
    el.addEventListener('error', () => {
      missing.add(it.src);
      notice('파일을 찾을 수 없습니다:\n' + [...missing].join('\n'));
    });
    el.addEventListener(el.tagName === 'VIDEO' ? 'loadeddata' : 'load', () => {
      if (missing.delete(it.src) && !missing.size) notice('');
    });
    return el;
  }

  function clearLayer(layer) {
    layer.querySelectorAll('video').forEach(v => {
      try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
    });
    layer.innerHTML = '';
  }

  function prepare(i) {
    if (prepared && prepared.i === i) return;
    clearLayer(back);
    const el = makeEl(items[i]);
    back.appendChild(el);
    prepared = { i, el };
  }

  function seekVideo(v, intoMs) {
    const go = () => { try { v.currentTime = intoMs / 1000; } catch (e) {} };
    if (v.readyState >= 1) go(); else v.addEventListener('loadedmetadata', go, { once: true });
  }

  function show(i, into) {
    prepare(i);
    const el = prepared.el;
    prepared = null;
    if (el.tagName === 'VIDEO') { seekVideo(el, into); el.play().catch(() => {}); }
    back.classList.add('on');
    front.classList.remove('on');
    const old = front; front = back; back = old;
    lastSwitch = Date.now();
    setTimeout(() => { if (!prepared && !back.classList.contains('on')) clearLayer(back); }, FADE_MS + 50);
  }

  // 영상이 기준 시각에서 벗어나면 살짝 빠르게/느리게, 많이 벗어나면 점프
  function fixDrift(v, intoMs) {
    if (v.readyState < 2) return;
    const target = intoMs / 1000;
    if (v.duration && target > v.duration) return; // 지정 시간이 영상보다 길면 마지막 프레임 유지
    const diff = v.currentTime - target;
    if (Math.abs(diff) > 1) { v.currentTime = target; v.playbackRate = 1; }
    else if (Math.abs(diff) > 0.08) v.playbackRate = diff > 0 ? 0.95 : 1.05;
    else v.playbackRate = 1;
    if (v.paused) v.play().catch(() => {});
  }

  function tick() {
    if (!cycle) return;
    const L = locate(now());
    if (L.i !== curIdx) {
      curIdx = L.i;
      show(L.i, L.into);
    } else {
      const v = front.querySelector('video');
      if (v) fixDrift(v, L.into);
      if (items.length > 1 && L.left < PRELOAD_MS && Date.now() - lastSwitch > FADE_MS + 100) {
        prepare((L.i + 1) % items.length);
      }
    }
    if (DEBUG) {
      const v = front.querySelector('video');
      dbg.textContent =
        `item ${L.i + 1}/${items.length}  ${items[L.i].src}\n` +
        `into ${(L.into / 1000).toFixed(2)}s  left ${(L.left / 1000).toFixed(1)}s\n` +
        `clock offset ${offset}ms` +
        (v ? `\nvideo ${v.currentTime.toFixed(2)}s  rate ${v.playbackRate}` : '');
    }
  }

  (async () => {
    await syncClock();
    await loadPlaylist();
    setInterval(tick, TICK_MS);
    setInterval(loadPlaylist, POLL_MS);
    setInterval(syncClock, CLOCK_SYNC_MS);
    setTimeout(() => location.reload(), RELOAD_MS);
    tick();
  })();
})();
</script>
</body>
</html>

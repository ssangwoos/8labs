<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Eight Labs — 문의 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --red:#C0202E; --red-lift:#E4404E; --gold:#F0C31E;
  --bg:#12100F; --panel:#191514; --panel-2:#211C1B;
  --tx:#F4F1EF; --dim:#A79E9A; --faint:#736A66;
  --rule:#2E2725; --rule-2:#3A3230;
  --ok:#4FB477;
  --f:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  --m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* ── 공통 ── */
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--m);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  padding:10px 16px;border:1px solid transparent;background:var(--red);color:#fff;
  cursor:pointer;transition:.15s;text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn--ghost{background:transparent;border-color:var(--rule-2);color:var(--tx)}
.btn--ghost:hover{border-color:var(--tx);filter:none}
.btn--danger{background:transparent;border-color:var(--rule-2);color:var(--faint)}
.btn--danger:hover{border-color:var(--red-lift);color:var(--red-lift);filter:none}
.pill{font-family:var(--m);font-size:10px;letter-spacing:.1em;padding:3px 8px;
  border:1px solid var(--rule-2);color:var(--dim);white-space:nowrap}
.pill.done{border-color:var(--ok);color:var(--ok)}

/* ── 로그인 ── */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--rule);
  padding:32px 28px;display:flex;flex-direction:column;gap:18px}
.card .eyebrow{font-family:var(--m);font-size:10.5px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--faint)}
.card h1{font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.3}
.fld{display:flex;flex-direction:column;gap:7px}
.fld label{font-family:var(--m);font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--faint)}
.fld input{font-family:var(--f);font-size:15px;color:var(--tx);background:transparent;
  border:1px solid var(--rule-2);padding:11px 13px;width:100%;transition:border-color .15s}
.fld input:focus{outline:none;border-color:var(--gold)}
.msg{font-size:13px;line-height:1.6;color:var(--dim);min-height:1.6em}
.msg.err{color:var(--red-lift)}

/* ── 헤더 ── */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
  padding:0 20px;height:58px;background:var(--bg);border-bottom:1px solid var(--rule)}
.top .brand{font-family:var(--m);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.top .brand b{color:var(--red-lift);font-weight:600}
.top .who{margin-left:auto;font-family:var(--m);font-size:11.5px;color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.top .btn{padding:7px 12px;font-size:11px}

/* ── 필터 ── */
.bar{display:flex;align-items:center;gap:8px;padding:14px 20px;
  border-bottom:1px solid var(--rule);flex-wrap:wrap}
.chip{font-family:var(--m);font-size:11.5px;letter-spacing:.06em;padding:6px 12px;
  border:1px solid var(--rule-2);background:transparent;color:var(--dim);cursor:pointer;
  transition:.15s}
.chip:hover{color:var(--tx)}
.chip[aria-pressed="true"]{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.bar .count{margin-left:auto;font-family:var(--m);font-size:11.5px;color:var(--faint)}

/* ── 본문 2단 ── */
.wrap{display:grid;grid-template-columns:minmax(300px,380px) 1fr;
  height:calc(100dvh - 58px - 53px)}
.list{border-right:1px solid var(--rule);overflow-y:auto}
.detail{overflow-y:auto;padding:32px clamp(20px,4vw,44px)}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr;height:auto}
  .list{border-right:0;border-bottom:1px solid var(--rule);max-height:44dvh}
  .detail{padding:24px 20px}
}

/* ── 리스트 ── */
.item{display:block;width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--rule);padding:14px 20px;cursor:pointer;
  border-left:2px solid transparent;transition:background .15s}
.item:hover{background:var(--panel)}
.item[aria-current="true"]{background:var(--panel-2);border-left-color:var(--red-lift)}
.item .r1{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.item .co{font-weight:700;font-size:14.5px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r2{display:flex;align-items:center;gap:10px;
  font-family:var(--m);font-size:11px;color:var(--faint)}
.item .pv{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.empty{padding:40px 20px;color:var(--faint);font-size:13.5px;line-height:1.8}

/* ── 상세 ── */
.dhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;
  padding-bottom:20px;border-bottom:1px solid var(--rule)}
.dhead h2{font-size:clamp(21px,3vw,28px);font-weight:900;letter-spacing:-.025em;line-height:1.3}
.dhead .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:0;margin:0 0 28px}
.meta .m{padding:16px 0;border-bottom:1px solid var(--rule)}
.meta .mk{font-family:var(--m);font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--faint)}
.meta .mv{margin-top:6px;font-size:15px;font-weight:500;word-break:break-all}
.meta a.mv{color:var(--tx);text-decoration:none;border-bottom:1px solid var(--rule-2)}
.meta a.mv:hover{color:var(--gold);border-bottom-color:var(--gold)}
.body{background:var(--panel);border:1px solid var(--rule);border-top:2px solid var(--red);
  padding:24px;white-space:pre-wrap;font-size:15px;line-height:1.85}
.dact{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;
  padding-top:22px;border-top:1px solid var(--rule)}
.dact .sp{margin-left:auto}
.blank{display:grid;place-items:center;height:100%;min-height:200px;
  color:var(--faint);font-size:13.5px;text-align:center;line-height:1.9}
/* ── 탭 ── */
.tabs{display:flex;gap:2px;margin-left:20px}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--faint);font-family:var(--m);font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;padding:19px 14px;cursor:pointer;transition:.15s}
.tab:hover{color:var(--dim)}
.tab[aria-selected="true"]{color:var(--tx);border-bottom-color:var(--red-lift)}

/* ── 클라이언트 ── */
.cwrap{display:grid;grid-template-columns:minmax(240px,300px) 1fr;
  height:calc(100dvh - 58px)}
.clist{border-right:1px solid var(--rule);overflow-y:auto}
.cedit{overflow-y:auto;padding:28px clamp(20px,4vw,44px) 80px}
@media (max-width:860px){
  .cwrap{grid-template-columns:1fr;height:auto}
  .clist{border-right:0;border-bottom:1px solid var(--rule);max-height:36dvh}
  .cedit{padding:22px 20px 60px}
}
.cnew{width:100%;padding:14px 20px;background:transparent;border:0;
  border-bottom:1px solid var(--rule);color:var(--red-lift);cursor:pointer;
  font-family:var(--m);font-size:11.5px;letter-spacing:.1em;text-align:left}
.cnew:hover{background:var(--panel)}
.citem{display:block;width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--rule);padding:13px 20px;cursor:pointer;
  border-left:2px solid transparent;transition:background .15s}
.citem:hover{background:var(--panel)}
.citem[aria-current="true"]{background:var(--panel-2);border-left-color:var(--red-lift)}
.citem .cn{font-weight:700;font-size:14.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.citem .cs{font-family:var(--m);font-size:11px;color:var(--faint);margin-top:4px;
  display:flex;gap:8px;align-items:center}

.sec{margin-bottom:34px}
.sec>h3{font-family:var(--m);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--faint);padding-bottom:10px;border-bottom:1px solid var(--rule);margin-bottom:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.grid2 .fld input{padding:10px 12px;font-size:14px}
.hint{font-size:12.5px;color:var(--faint);line-height:1.7;margin-top:10px}
.hint code{font-family:var(--m);font-size:11.5px;background:var(--panel-2);padding:1px 5px}

.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px}
.chk{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--dim);cursor:pointer}
.chk input{accent-color:var(--red-lift);width:15px;height:15px;flex:none}

.ctable{width:100%;border-collapse:collapse;min-width:900px}
.ctable th{font-family:var(--m);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule);font-weight:500}
.ctable td{padding:4px 6px;border-bottom:1px solid var(--rule)}
.ctable input,.ctable select{width:100%;background:transparent;border:1px solid transparent;
  color:var(--tx);font-family:var(--f);font-size:13px;padding:7px 8px}
.ctable input:hover,.ctable select:hover{border-color:var(--rule-2)}
.ctable input:focus,.ctable select:focus{outline:none;border-color:var(--gold);background:var(--panel)}
.ctable select{color-scheme:dark}
.ctable .rm{background:transparent;border:1px solid var(--rule-2);color:var(--faint);
  cursor:pointer;padding:5px 9px;font-size:11px;line-height:1}
.ctable .rm:hover{border-color:var(--red-lift);color:var(--red-lift)}
.tscroll{overflow-x:auto;border:1px solid var(--rule);background:var(--panel)}
textarea.paste{width:100%;min-height:110px;background:var(--panel);color:var(--tx);
  border:1px solid var(--rule-2);padding:12px;font-family:var(--m);font-size:12.5px;
  line-height:1.7;resize:vertical}
textarea.paste:focus{outline:none;border-color:var(--gold)}

.savebar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:16px 0;margin-top:8px;background:linear-gradient(transparent,var(--bg) 22%)}
.savebar .sp{margin-left:auto}
.acct{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--rule);padding:14px 16px}
.acct .st{font-family:var(--m);font-size:11.5px;color:var(--dim);flex:1;min-width:180px}
.acct .st b{color:var(--ok)}
.pwout{font-family:var(--m);font-size:13px;background:var(--panel-2);border:1px solid var(--gold);
  padding:10px 13px;color:var(--gold);word-break:break-all;margin-top:12px}
.uidbox{font-family:var(--m);font-size:12.5px;background:var(--panel-2);
  border:1px solid var(--gold);color:var(--gold);padding:10px 12px;margin:14px 0 10px;
  word-break:break-all;user-select:all}
.diag{color:var(--dim);font-size:13px;line-height:1.8}
.diag b{color:var(--red-lift)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
  background:var(--panel-2);border:1px solid var(--rule-2);padding:11px 18px;
  font-size:13.5px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
</style>
</head>
<body>

<!-- ══════════ 로그인 ══════════ -->
<section id="login">
  <form class="card" id="login-form">
    <div class="eyebrow">Eight Labs</div>
    <h1>문의 관리</h1>
    <div class="fld">
      <label for="l-email">이메일</label>
      <input id="l-email" type="email" autocomplete="username" required>
    </div>
    <div class="fld">
      <label for="l-pw">비밀번호</label>
      <input id="l-pw" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit" id="l-btn">로그인</button>
    <p class="msg" id="l-msg" role="status" aria-live="polite">불러오는 중…</p>
  </form>
</section>

<!-- ══════════ 관리 화면 ══════════ -->
<div id="app" hidden>
  <header class="top">
    <span class="brand"><b>8LABS</b> · 관리</span>
    <div class="tabs" role="tablist">
      <button class="tab" id="t-inq" role="tab" aria-selected="true">문의</button>
      <button class="tab" id="t-cli" role="tab" aria-selected="false">클라이언트</button>
    </div>
    <span class="who" id="who"></span>
    <button class="btn btn--ghost" id="reload">새로고침</button>
    <button class="btn btn--ghost" id="logout">로그아웃</button>
  </header>

  <section id="tab-inq">
  <div class="bar">
    <button class="chip" data-f="all" aria-pressed="true">전체</button>
    <button class="chip" data-f="received" aria-pressed="false">접수됨</button>
    <button class="chip" data-f="answered" aria-pressed="false">답변 완료</button>
    <span class="count" id="count"></span>
  </div>

  <div class="wrap">
    <div class="list" id="list"></div>
    <div class="detail" id="detail">
      <div class="blank">왼쪽에서 문의를 선택하세요.</div>
    </div>
  </div>
  </section>

  <!-- ══════════ 클라이언트 ══════════ -->
  <section id="tab-cli" hidden>
    <div class="cwrap">
      <div class="clist">
        <button class="cnew" id="c-new">+ 새 클라이언트</button>
        <div id="c-list"></div>
      </div>
      <div class="cedit" id="c-edit">
        <div class="blank">왼쪽에서 클라이언트를 선택하거나 새로 추가하세요.</div>
      </div>
    </div>
  </section>
</div>

<script type="module">
/* ══════════════════════════════════════════════════════════════
   Eight Labs — 문의 관리
   Firestore 규칙상 board/{id}/private/detail 은 로그인해야 읽힙니다.
   ══════════════════════════════════════════════════════════════ */
const SDK = 'https://www.gstatic.com/firebasejs/10.12.5/';
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD1LHBaYbxaHfZTOQwZrYqDoNNcJkq-Z_8",
  authDomain: "promptmarket-c3c3a.firebaseapp.com",
  projectId: "promptmarket-c3c3a",
  storageBucket: "promptmarket-c3c3a.firebasestorage.app",
  messagingSenderId: "235384803267",
  appId: "1:235384803267:web:ae44b6158c6ce31ebe3776"
};

const $ = s => document.querySelector(s);
const loginEl = $('#login'), appEl = $('#app'), lMsg = $('#l-msg'), lBtn = $('#l-btn');
const listEl = $('#list'), detailEl = $('#detail'), countEl = $('#count');

let A = null, F = null, auth = null, db = null, APP = null, FN = null, fns = null;
let ROWS = [], filter = 'all', selected = null;

const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
function when(ts){
  const d = ts && ts.toDate ? ts.toDate() : null;
  if (!d) return '—';
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function toast(text){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
function say(text, err){ lMsg.textContent = text; lMsg.className = 'msg' + (err ? ' err' : ''); }

/* ───────── 부팅 ───────── */
try {
  const { initializeApp } = await import(SDK + 'firebase-app.js');
  A = await import(SDK + 'firebase-auth.js');
  F = await import(SDK + 'firebase-firestore.js');
  APP = initializeApp(FIREBASE_CONFIG);
  auth = A.getAuth(APP);
  db = F.getFirestore(APP);
  say('');
  A.onAuthStateChanged(auth, user => {
    if (user) {
      loginEl.hidden = true; appEl.hidden = false;
      $('#who').textContent = user.email || '';
      load();
    } else {
      appEl.hidden = true; loginEl.hidden = false;
      ROWS = []; selected = null;
    }
  });
} catch (e) {
  console.error(e);
  say('Firebase 를 불러오지 못했습니다. 네트워크를 확인해주세요.', true);
  lBtn.disabled = true;
}

/* ───────── 로그인 ───────── */
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#l-email').value.trim(), pw = $('#l-pw').value;
  if (!email || !pw) return say('이메일과 비밀번호를 입력해주세요.', true);
  lBtn.disabled = true; say('로그인 중…');
  try {
    await A.signInWithEmailAndPassword(auth, email, pw);
    $('#l-pw').value = ''; say('');
  } catch (err) {
    const map = {
      'auth/invalid-credential': '이메일 또는 비밀번호가 맞지 않습니다.',
      'auth/invalid-email': '이메일 형식을 확인해주세요.',
      'auth/too-many-requests': '시도가 너무 많습니다. 잠시 후 다시 해주세요.',
      'auth/operation-not-allowed': 'Firebase 콘솔에서 이메일/비밀번호 로그인을 켜주세요.',
      'auth/network-request-failed': '네트워크 오류입니다.'
    };
    say(map[err.code] || ('로그인 실패: ' + err.code), true);
  } finally {
    lBtn.disabled = false;
  }
});
$('#logout').addEventListener('click', () => A.signOut(auth));
$('#reload').addEventListener('click', () => load());

/* ───────── 목록 ───────── */
async function load(){
  listEl.innerHTML = '<div class="empty">불러오는 중…</div>';
  try {
    const q = F.query(F.collection(db, 'board'), F.orderBy('createdAt', 'desc'), F.limit(100));
    const snap = await F.getDocs(q);
    ROWS = await Promise.all(snap.docs.map(async d => {
      let detail = {};
      try {
        const ds = await F.getDoc(F.doc(db, 'board', d.id, 'private', 'detail'));
        if (ds.exists()) detail = ds.data();
      } catch (e) { console.warn('detail', d.id, e.code); }
      return { id: d.id, ...d.data(), detail };
    }));
    render();
  } catch (err) {
    console.error(err);
    listEl.innerHTML = '<div class="empty">' +
      (err.code === 'permission-denied'
        ? '읽기 권한이 없습니다. Firestore 규칙을 확인해주세요.'
        : '목록을 불러오지 못했습니다. (' + esc(err.code || err.message) + ')') + '</div>';
  }
}

document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  filter = c.dataset.f;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === c)));
  render();
}));

function visible(){
  return filter === 'all' ? ROWS : ROWS.filter(r => (r.status || 'received') === filter);
}

function render(){
  const rows = visible();
  const n = ROWS.length, waiting = ROWS.filter(r => (r.status || 'received') !== 'answered').length;
  countEl.textContent = `전체 ${n}건 · 미답변 ${waiting}건`;

  if (!rows.length){
    listEl.innerHTML = '<div class="empty">해당하는 문의가 없습니다.</div>';
    if (!ROWS.length) detailEl.innerHTML = '<div class="blank">등록된 문의가 없습니다.</div>';
    return;
  }

  listEl.innerHTML = rows.map(r => {
    const done = r.status === 'answered';
    const d = r.detail || {};
    return `<button class="item" data-id="${esc(r.id)}" aria-current="${r.id === selected}">

  listEl.querySelectorAll('.item').forEach(b =>

      <button class="btn btn--ghost" id="a-toggle">${done ? '접수됨으로 되돌리기' : '답변 완료로 표시'}</button>

/* ───────── 변경 ───────── */
async function setStatus(id, status){
  try {
    await F.updateDoc(F.doc(db, 'board', id), { status });
    const r = ROWS.find(x => x.id === id);
    if (r) r.status = status;
    render();
    toast(status === 'answered' ? '답변 완료로 표시했습니다.' : '접수됨으로 되돌렸습니다.');
  } catch (err) {
    console.error(err);
    toast('변경에 실패했습니다. (' + (err.code || err.message) + ')');
  }
}

async function remove(id, label){
  if (!confirm(`"${label}" 문의를 삭제합니다.\n내용과 연락처가 함께 지워지고 되돌릴 수 없습니다.`)) return;
  try {
    await F.deleteDoc(F.doc(db, 'board', id, 'private', 'detail'));
    await F.deleteDoc(F.doc(db, 'board', id));
    ROWS = ROWS.filter(x => x.id !== id);
    selected = null;
    detailEl.innerHTML = '<div class="blank">왼쪽에서 문의를 선택하세요.</div>';
    render();
    toast('삭제했습니다.');
  } catch (err) {
    console.error(err);
    toast('삭제에 실패했습니다. (' + (err.code || err.message) + ')');
  }
}

/* Cloud Function 호출 (서울 리전) */
async function callFn(name, data){
  if (!FN) {
    FN = await import(SDK + 'firebase-functions.js');
    fns = FN.getFunctions(APP, 'asia-northeast3');
  }
  const res = await FN.httpsCallable(fns, name)(data);
  return res.data;
}
function fnErr(err){
  if (err.code === 'functions/not-found' || err.code === 'not-found')
    return '함수가 아직 배포되지 않았습니다. functions 폴더에서 배포해 주세요.';
  if (err.code === 'functions/permission-denied')
    return err.message || '관리자만 사용할 수 있습니다.';
  if (err.code === 'functions/invalid-argument' || err.code === 'functions/failed-precondition')
    return err.message;
  if (err.code === 'functions/unauthenticated') return '다시 로그인해 주세요.';
  return '실패: ' + (err.message || err.code);
}

function mark(){ const el = $('#c-state'); if (el) el.textContent = '저장하지 않은 변경'; }

function parsePaste(text){
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map((line, i) => {
    const p = line.split(/\t|\s{2,}/).map(x => x.trim()).filter(x => x !== '');
    const num = v => { if (!v) return null; const n = Number(String(v).replace(/[,\s]/g,'')); return isNaN(n) ? null : n; };
    let round = 1, k = 0;
    if (/^\d+차?$/.test(p[0]) && p[1] && !/^\d/.test(p[1])) { round = parseInt(p[0]); k = 1; }
    const handle = p[k] || '';
    const rest = p.slice(k + 1);
    const st = rest.find(x => KO_STATUS[x] || ['confirmed','visited','published'].includes(x));
    const dates = rest.filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x));
    const plat = rest.find(x => /^(instagram|tiktok|youtube)$/i.test(x));
    const nums = rest.filter(x => /^[\d,]+$/.test(x)).map(num);
    const urlv = rest.find(x => /^https?:\/\//.test(x));
    return {
      round, handle,
      followers: nums[0] ?? null,
      platform: plat ? plat[0].toUpperCase() + plat.slice(1).replace(/tok/i,'Tok') : 'Instagram',
      status: st ? (KO_STATUS[st] || st) : 'confirmed',
      visit: dates[0] || null, post: dates[1] || null,
      views: nums[1] ?? null, url: urlv || null, order: i + 1
    };
  });
}

function bindEditor(){
  $('#c-edit').querySelectorAll('input[data-p]').forEach(el => {
    el.addEventListener('input', e => {
      const path = e.target.dataset.p.split('.');
      let o = cur;
      for (let i = 0; i < path.length - 1; i++) { if (!o[path[i]]) o[path[i]] = {}; o = o[path[i]]; }
      o[path.at(-1)] = e.target.value;
      mark();
    });
  });
  $('#c-edit').querySelectorAll('[data-kpi],[data-col],[data-sec]').forEach(el => {
    el.addEventListener('change', e => {
      const t = e.target;
      if (t.dataset.kpi){ cur.config.kpis = cur.config.kpis || {}; cur.config.kpis[t.dataset.kpi] = t.checked; }
      if (t.dataset.col){ cur.config.cols = cur.config.cols || {}; cur.config.cols[t.dataset.col] = t.checked; }
      if (t.dataset.sec){ cur.config[t.dataset.sec] = t.checked; }
      mark();
    });
  });

  $('#c-add')?.addEventListener('click', () => {
    const rows = parsePaste($('#c-paste').value);
    if (!rows.length) return toast('붙여넣은 내용이 없습니다.');
    rows.forEach(r => { r.order = curCreators.length + 1; curCreators.push(r); });
    $('#c-paste').value = ''; renderRows(); mark(); toast(rows.length + '명 추가했습니다.');
  });
  $('#c-replace')?.addEventListener('click', () => {
    const rows = parsePaste($('#c-paste').value);
    if (!rows.length) return toast('붙여넣은 내용이 없습니다.');
    curCreators = rows; $('#c-paste').value = ''; renderRows(); mark();
    toast(rows.length + '명으로 교체했습니다.');
  });
  $('#c-row')?.addEventListener('click', () => {
    curCreators.push({ round:1, handle:'', followers:null, platform:'Instagram',
      status:'confirmed', visit:null, post:null, views:null, url:null, order: curCreators.length + 1 });
    renderRows(); mark();
  });

  const genPw = () => {
    const cs = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const a = crypto.getRandomValues(new Uint32Array(12));
    return [...a].map(n => cs[n % cs.length]).join('');
  };
  $('#c-genpw2')?.addEventListener('click', () => { $('#c-newpw').value = genPw(); });
  $('#c-setpw')?.addEventListener('click', async () => {
    const pw = $('#c-newpw').value.trim();
    if (pw.length < 10) return toast('비밀번호는 10자 이상으로 해주세요.');
    const btn = $('#c-setpw'); btn.disabled = true;
    try {
      await callFn('setClientPassword', { uid: cur.ownerUid, password: pw });
      newPw = pw; renderEditor();
      toast('비밀번호를 변경했습니다.');
    } catch (err) { console.error(err); toast(fnErr(err)); btn.disabled = false; }
  });

  $('#c-genpw')?.addEventListener('click', () => { $('#c-pw').value = genPw(); });
  $('#c-mkacct')?.addEventListener('click', createAccount);
  $('#c-unlink')?.addEventListener('click', () => {
    if (!confirm('이 클라이언트에서 계정 연결만 해제합니다.\n로그인 계정 자체는 남아 있으며, Firebase 콘솔에서 따로 지워야 합니다.\n해제 후 저장을 눌러야 반영됩니다.')) return;
    cur.ownerUid = null; newPw = '';
    renderEditor(); mark();
    toast('연결을 해제했습니다. 저장을 눌러주세요.');
  });
  $('#c-reset')?.addEventListener('click', async () => {
    try { await A.sendPasswordResetEmail(auth, cur.ownerEmail); toast('재설정 메일을 보냈습니다.'); }
    catch (e) { toast('실패: ' + (e.code || e.message)); }
  });
  $('#c-save').addEventListener('click', saveClient);
  $('#c-del')?.addEventListener('click', deleteClient);
}

/* ── 계정 생성: 보조 앱 인스턴스로 만들어 현재 로그인을 유지합니다 ── */
async function createAccount(){
  const email = $('#c-email').value.trim(), pw = $('#c-pw').value;
  if (!email) return toast('이메일을 입력해주세요.');
  if (pw.length < 10) return toast('비밀번호는 10자 이상으로 해주세요.');
  const btn = $('#c-mkacct'); btn.disabled = true;
  try {
    const { initializeApp, deleteApp } = await import(SDK + 'firebase-app.js');
    const tmp = initializeApp(FIREBASE_CONFIG, 'mk-' + Date.now());
    const tmpAuth = A.getAuth(tmp);
    const cred = await A.createUserWithEmailAndPassword(tmpAuth, email, pw);
    cur.ownerUid = cred.user.uid;
    cur.ownerEmail = email;
    newPw = pw;
    await A.signOut(tmpAuth);
    await deleteApp(tmp);
    renderEditor();
    toast('계정을 만들었습니다. 저장을 눌러 연결하세요.');
  } catch (err) {
    const map = {
      'auth/email-already-in-use':'이미 사용 중인 이메일입니다.',
      'auth/invalid-email':'이메일 형식을 확인해주세요.',
      'auth/weak-password':'비밀번호가 너무 짧습니다.',
      'auth/operation-not-allowed':'콘솔에서 이메일/비밀번호 로그인을 켜주세요.'
    };
    toast(map[err.code] || ('실패: ' + err.code));
    btn.disabled = false;
  }
}

async function saveClient(){
  if (!cur.name.trim()) return toast('업체명을 입력해주세요.');
  const btn = $('#c-save'); btn.disabled = true; $('#c-state').textContent = '저장 중…';
  try {
    const payload = {
      name: cur.name.trim(),
      ownerUid: cur.ownerUid || null,
      ownerEmail: cur.ownerEmail || '',
      package: {
        name: (cur.package.name || '').trim(),
        rounds: Number(cur.package.rounds) || null,
        creatorCount: Number(cur.package.creatorCount) || null,
        note: (cur.package.note || '').trim()
      },
      meta: cur.meta,
      config: cur.config,
      updatedAt: F.serverTimestamp()
    };
    if (!curId) {
      payload.createdAt = F.serverTimestamp();
      curId = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    }
    await F.setDoc(F.doc(db, 'clients', curId), payload, { merge: true });

    // 크리에이터 전체 재기록
    const old = await F.getDocs(F.collection(db, 'clients', curId, 'creators'));
    const batch = F.writeBatch(db);
    old.docs.forEach(d => batch.delete(d.ref));
    curCreators.forEach((r, i) => {
      const id = 'r' + String(i + 1).padStart(4, '0');
      batch.set(F.doc(db, 'clients', curId, 'creators', id), {
        round: Number(r.round) || 1,
        handle: r.handle || '',
        followers: r.followers ?? null,
        platform: r.platform || 'Instagram',
        status: r.status || 'confirmed',
        visit: r.visit || null,
        post: r.post || null,
        views: r.views ?? null,
        url: r.url || null,
        order: i + 1
      });
    });
    await batch.commit();

    $('#c-state').textContent = '저장됨';
    toast('저장했습니다.');
    await loadClients();
    $('#c-list').querySelectorAll('.citem').forEach(b =>
      b.setAttribute('aria-current', String(b.dataset.id === curId)));
  } catch (err) {
    console.error(err);
    $('#c-state').textContent = '';
    if (err.code === 'permission-denied') {
      const d = await diagnose();
      toast('저장 실패 — 권한 없음. 클라이언트 목록 영역의 안내를 확인해주세요.');
      $('#c-list').innerHTML =
        `<div class="empty"><div class="diag">${d.msg}</div>` +
        `<div class="uidbox">${esc(d.email)}</div></div>`;
    } else {
      toast('저장 실패: ' + (err.code || err.message));
    }
  } finally { btn.disabled = false; }
}

async function deleteClient(){
  if (!confirm(`"${cur.name}" 클라이언트와 크리에이터 데이터를 모두 삭제합니다.`)) return;
  const alsoAccount = cur.ownerUid &&
    confirm('로그인 계정도 함께 삭제할까요?\n\n확인 = 계정까지 삭제\n취소 = 데이터만 삭제하고 계정은 남김');
  try {
    if (alsoAccount) {
      try { await callFn('deleteClientAccount', { uid: cur.ownerUid }); }
      catch (e) { toast('계정 삭제 실패 — ' + fnErr(e) + ' 데이터만 삭제합니다.'); }
    }
    const old = await F.getDocs(F.collection(db, 'clients', curId, 'creators'));
    const batch = F.writeBatch(db);
    old.docs.forEach(d => batch.delete(d.ref));
    batch.delete(F.doc(db, 'clients', curId));
    await batch.commit();
    curId = null; cur = null; curCreators = [];
    $('#c-edit').innerHTML = '<div class="blank">왼쪽에서 클라이언트를 선택하거나 새로 추가하세요.</div>';
    await loadClients();
    toast('삭제했습니다.');
  } catch (err) { toast('삭제 실패: ' + (err.code || err.message)); }
}

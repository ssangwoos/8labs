<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Eight Labs Campaign Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F7F5F4; --surface:#FFFFFF; --surface-2:#F2EEED; --surface-3:#EAE4E3;
  --ink:#15100F; --ink-2:#4B4241; --ink-3:#807472; --ink-4:#A99E9C;
  --line:#E4DDDB; --line-2:#F0EAE9;
  --brand:#C0202E;
  --s1:#E9B9BD; --s2:#C25A67; --s3:#8E141F;
  --on1:#7A1019; --on2:#FFFFFF; --on3:#FFFFFF;
  --warn:#8A6100; --warn-bg:#FBF0D8;
  --good:#17703F;
  --shadow:0 1px 2px rgba(21,16,15,.05), 0 10px 30px -22px rgba(21,16,15,.4);
  --logo-filter:none;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131010; --surface:#1C1817; --surface-2:#252020; --surface-3:#2F2827;
  --ink:#F3EDEB; --ink-2:#C6BAB7; --ink-3:#8F8280; --ink-4:#6B605E;
  --line:#332B2A; --line-2:#262020;
  --brand:#F0757C;
  --s1:#6E2A32; --s2:#C4535F; --s3:#F6B3B9;
  --on1:#F0A5AC; --on2:#FFFFFF; --on3:#3A1215;
  --warn:#E4B45C; --warn-bg:#332916;
  --good:#63C48D;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -22px rgba(0,0,0,.9);
  --logo-filter:invert(1);
}}
:root[data-theme="dark"]{
  --bg:#131010; --surface:#1C1817; --surface-2:#252020; --surface-3:#2F2827;
  --ink:#F3EDEB; --ink-2:#C6BAB7; --ink-3:#8F8280; --ink-4:#6B605E;
  --line:#332B2A; --line-2:#262020;
  --brand:#F0757C;
  --s1:#6E2A32; --s2:#C4535F; --s3:#F6B3B9;
  --on1:#F0A5AC; --on2:#FFFFFF; --on3:#3A1215;
  --warn:#E4B45C; --warn-bg:#332916;
  --good:#63C48D;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -22px rgba(0,0,0,.9);
  --logo-filter:invert(1);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans KR','Archivo',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1360px;margin:0 auto;padding:0 28px 72px}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.num{font-family:'Archivo',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

header{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1360px;margin:0 auto;padding:15px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{height:26px;width:auto;display:block;filter:var(--logo-filter)}
.divider{width:1px;height:22px;background:var(--line)}
.subttl{font-family:'Archivo';font-weight:700;font-size:12.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.live{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.12em;color:var(--good);text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.sample{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--warn-bg);color:var(--warn);padding:5px 11px;border-radius:3px;font-weight:600}
.spacer{margin-left:auto}
.tbtn{background:none;border:1px solid var(--line);color:var(--ink-2);border-radius:4px;padding:7px 13px;font:inherit;font-size:12px;cursor:pointer;font-weight:600}
.tbtn:hover{border-color:var(--ink-3);color:var(--ink)}
.tbtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.meta{display:flex;flex-wrap:wrap;padding:24px 0 20px;border-bottom:1px solid var(--line)}
.meta .m{padding-right:38px;margin-right:38px;border-right:1px solid var(--line)}
.meta .m:last-child{border-right:0;padding-right:0;margin-right:0}
.meta .k{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);margin-bottom:7px}
.meta .v{font-size:16px;font-weight:600}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:26px 0 2px}
.sub{color:var(--ink-3);font-size:14.5px;margin-bottom:4px}

/* scope toolbar */
.scope{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;box-shadow:var(--shadow)}
.seg{display:flex;background:var(--surface-2);border-radius:5px;padding:3px;gap:3px}
.seg button{background:none;border:0;border-radius:4px;padding:7px 15px;font:inherit;font-size:13px;font-weight:600;color:var(--ink-3);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.scopelb{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-4)}
.rounds{display:flex;gap:8px;flex-wrap:wrap}
.dates{display:flex;align-items:center;gap:10px}
.dates input{font:inherit;font-family:'IBM Plex Mono';font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:7px 10px;color-scheme:light dark}
.dates input:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.dates .tilde{color:var(--ink-4)}
.hidden{display:none !important}

.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.chip.ghost{background:transparent;border-style:dashed;color:var(--ink-3);font-weight:500}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:18px}
@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 20px 18px;box-shadow:var(--shadow)}
.kpi .k{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-4);margin-bottom:12px}
.kpi .v{font-size:34px;font-weight:800;line-height:1;color:var(--ink)}
.kpi .v small{font-size:16px;font-weight:600;color:var(--ink-3);margin-left:3px}
.kpi .s{margin-top:11px;font-size:12.5px;color:var(--ink-3)}
.kpi.hero .v{color:var(--brand)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px;box-shadow:var(--shadow);margin-top:16px}
.card h2{font-size:15px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.card .hint{font-size:12.5px;color:var(--ink-3);margin-bottom:18px}
.pipe{display:flex;height:40px;border-radius:4px;overflow:hidden;gap:3px}
.pipe .seg2{display:flex;align-items:center;justify-content:center;min-width:3px}
.pipe .seg2 span{font-family:'IBM Plex Mono';font-size:12.5px;font-weight:600;color:inherit}
.plegend{display:flex;flex-wrap:wrap;gap:24px;margin-top:16px}
.plegend .li{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2)}
.plegend .sw{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.06)}
.plegend b{font-weight:700;color:var(--ink);font-family:'Archivo';font-variant-numeric:tabular-nums}

.filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:22px 0 12px}
.count{margin-left:auto;font-size:13px;color:var(--ink-3)}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
thead th{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);font-weight:600;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--ink-2)}
thead th .arw{opacity:.35;margin-left:5px}
thead th[aria-sort] .arw{opacity:1;color:var(--brand)}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.r{text-align:right}
.rd{display:inline-block;font-family:'IBM Plex Mono';font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface-3);border-radius:4px;padding:4px 9px;white-space:nowrap}
.handle{font-weight:600;font-size:14.5px}
.handle.masked{color:var(--ink-4);font-weight:500}
.plat{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.06em;color:var(--ink-3)}
.st{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.st .i{width:9px;height:9px;border-radius:50%;flex:none}
.viewcell{display:flex;align-items:center;gap:12px;justify-content:flex-end;min-width:176px}
.vbar{height:9px;border-radius:4px 0 0 4px;background:var(--brand);flex:none}
.vnum{font-family:'Archivo';font-weight:700;font-variant-numeric:tabular-nums;min-width:62px;text-align:right;font-size:14.5px}
.dash{color:var(--ink-4)}
a.link{color:var(--brand);font-weight:600;text-decoration:none;font-size:13px;white-space:nowrap}
a.link:hover{text-decoration:underline}
a.link:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:14px}

footer{margin-top:24px;font-size:12.5px;color:var(--ink-4);line-height:1.7}
footer b{color:var(--ink-3)}
.who{font-size:11.5px;color:var(--ink-4);max-width:34vw;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

/* ── 패키지 스트립 ── */
.pkg{display:flex;align-items:center;gap:clamp(18px,3vw,40px);flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brand);
  border-radius:6px;padding:18px 22px;margin-top:20px;box-shadow:var(--shadow)}
.pkg .pk{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-4);margin-bottom:7px}
.pkg .pname{font-size:17px;font-weight:700;letter-spacing:-.01em}
.pkg .pspec{font-size:14px;color:var(--ink-2);font-weight:500}
.pkg .prog{margin-left:auto;min-width:190px}
.pkg .ptrack{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-top:9px}
.pkg .pfill{height:100%;background:var(--brand);border-radius:4px;transition:width .5s ease}
.pkg .pnum{font-family:'Archivo';font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.pkg .pnum small{font-weight:600;color:var(--ink-3);font-size:13px}
@media(max-width:640px){.pkg .prog{margin-left:0;width:100%}}

/* ── 로그인 게이트 ── */
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);
  display:grid;place-items:center;padding:24px}
#gate.hidden{display:none!important}
.gcard{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:32px 28px;display:flex;flex-direction:column;gap:18px;
  box-shadow:var(--shadow)}
.gcard .logo{height:22px}
.gcard h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}
.gcard p{font-size:13px;color:var(--ink-3);margin:6px 0 0}
.gfld{display:flex;flex-direction:column;gap:7px}
.gfld label{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-4)}
.gfld input{font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:5px;padding:11px 12px;width:100%}
.gfld input:focus{outline:none;border-color:var(--brand)}
.gbtn{background:var(--brand);color:#fff;border:0;border-radius:5px;padding:12px;
  font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.gbtn:hover{filter:brightness(1.08)}
.gbtn:disabled{opacity:.5;cursor:default}
.gmsg{font-size:12.5px;line-height:1.6;color:var(--ink-3);min-height:1.6em;margin:0}
.gmsg.err{color:var(--brand)}
.notice{max-width:520px;margin:16vh auto;padding:0 24px;text-align:center}
.notice h1{font-size:21px;margin:0 0 10px}
.notice p{color:var(--ink-3);font-size:14.5px;line-height:1.75}
</style>
</head>

    <div>
      <h2>캠페인 대시보드</h2>
      <p>발급받으신 계정으로 로그인해 주세요.</p>
    </div>
    <div class="gfld">
      <label for="g-email">이메일</label>
      <input id="g-email" type="email" autocomplete="username" required>
    </div>
    <div class="gfld">
      <label for="g-pw">비밀번호</label>
      <input id="g-pw" type="password" autocomplete="current-password" required>
    </div>
    <button class="gbtn" type="submit" id="g-btn">로그인</button>
    <p class="gmsg" id="g-msg" role="status" aria-live="polite">불러오는 중…</p>
  </form>
</div>

<script type="module">
/* ══════════════════════════════════════════════════════════════
   Eight Labs — 클라이언트 캠페인 대시보드
   로그인한 계정에 연결된 clients/{id} 를 찾아 그립니다.
   스태프 계정은 ?c=<clientId> 로 특정 업체를 열 수 있습니다.
   ══════════════════════════════════════════════════════════════ */
const SDK = 'https://www.gstatic.com/firebasejs/10.12.5/';
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD1LHBaYbxaHfZTOQwZrYqDoNNcJkq-Z_8",
  authDomain: "promptmarket-c3c3a.firebaseapp.com",
  projectId: "promptmarket-c3c3a",
  storageBucket: "promptmarket-c3c3a.firebasestorage.app",
  messagingSenderId: "235384803267",
  appId: "1:235384803267:web:ae44b6158c6ce31ebe3776"
};

let META = { title:'', brand:'', campaign:'', period:'', platform:'', manager:'Eight Labs' };
let CONFIG = {
  kpis:{creators:true,visited:true,published:true,views:true,avg:true},
  cols:{round:true,handle:true,followers:true,platform:true,status:true,visit:true,post:true,views:true,url:true},
  pipeline:true, rounds:true, dates:true
};
let ROWS = [];
let PKG = null;

const STAGES = [
  {key:'confirmed', label:'확정',        color:'var(--s1)', ink:'var(--on1)'},
  {key:'visited',   label:'방문 완료',   color:'var(--s2)', ink:'var(--on2)'},
  {key:'published', label:'업로드 완료', color:'var(--s3)', ink:'var(--on3)'},
];
const STAGE = Object.fromEntries(STAGES.map(s=>[s.key,s]));

const fmt = n => n>=1e6 ? (n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M'
              : n>=1e3 ? Math.round(n/100)/10+'K' : String(n);
const md = d => d ? String(d).slice(5).replace('-','.') : null;
const esc = v => String(v ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const $ = q => document.querySelector(q);
const gate = $('#gate'), gMsg = $('#g-msg'), gBtn = $('#g-btn');
let A, F, auth, db, started = false;

function gsay(t, err){ gMsg.textContent = t; gMsg.className = 'gmsg' + (err ? ' err' : ''); }
function notice(title, body){
  gate.classList.add('hidden');
  document.querySelector('.wrap').innerHTML =
    `<div class="notice"><h1>${esc(title)}</h1><p>${body}</p></div>`;
}

/* ───────── 부팅 ───────── */
try {
  const { initializeApp } = await import(SDK + 'firebase-app.js');
  A = await import(SDK + 'firebase-auth.js');
  F = await import(SDK + 'firebase-firestore.js');
  const app = initializeApp(FIREBASE_CONFIG);
  auth = A.getAuth(app);
  db = F.getFirestore(app);
  gsay('');
  A.onAuthStateChanged(auth, user => {
    if (!user) { gate.classList.remove('hidden'); return; }
    $('#who').textContent = user.email || '';
    $('#logout').classList.remove('hidden');
    loadClient(user);
  });
} catch (e) {
  console.error(e);
  gsay('연결에 실패했습니다. 네트워크를 확인해 주세요.', true);
  gBtn.disabled = true;
}

$('#gate-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#g-email').value.trim(), pw = $('#g-pw').value;
  if (!email || !pw) return gsay('이메일과 비밀번호를 입력해 주세요.', true);
  gBtn.disabled = true; gsay('로그인 중…');
  try {
    await A.signInWithEmailAndPassword(auth, email, pw);
    $('#g-pw').value = ''; gsay('');
  } catch (err) {
    const map = {
      'auth/invalid-credential':'이메일 또는 비밀번호가 맞지 않습니다.',
      'auth/invalid-email':'이메일 형식을 확인해 주세요.',
      'auth/too-many-requests':'시도가 너무 많습니다. 잠시 후 다시 해주세요.',
      'auth/network-request-failed':'네트워크 오류입니다.'
    };
    gsay(map[err.code] || ('로그인 실패: ' + err.code), true);
  } finally { gBtn.disabled = false; }
});
$('#logout').addEventListener('click', () => A.signOut(auth).then(()=>location.reload()));

/* ───────── 데이터 로드 ───────── */
async function loadClient(user){
  if (started) return;
  try {
    const forced = new URLSearchParams(location.search).get('c');
    let id = null, data = null;

    if (forced) {
      const d = await F.getDoc(F.doc(db, 'clients', forced));
      if (d.exists()) { id = d.id; data = d.data(); $('#staffTag').classList.remove('hidden'); }
    } else {
      const qs = await F.getDocs(F.query(
        F.collection(db, 'clients'), F.where('ownerUid', '==', user.uid), F.limit(1)));
      if (!qs.empty) { id = qs.docs[0].id; data = qs.docs[0].data(); }
    }

    if (!data) {
      return notice('연결된 캠페인이 없습니다',
        '계정에 캠페인이 아직 연결되지 않았습니다.<br>담당 매니저에게 문의해 주세요.');
    }

    META   = Object.assign(META, data.meta || {});
    CONFIG = Object.assign(CONFIG, data.config || {});
    PKG    = data.package || null;

    const cs = await F.getDocs(F.collection(db, 'clients', id, 'creators'));
    ROWS = cs.docs.map(d => {
      const v = d.data();
      return {
        round: Number(v.round) || 1,
        handle: v.handle || '',
        masked: v.masked === true || !String(v.handle || '').startsWith('@'),
        followers: v.followers ?? null,
        platform: v.platform || 'Instagram',
        status: v.status || 'confirmed',
        visit: v.visit || null,
        post: v.post || null,
        views: v.views ?? null,
        url: v.url || null,
        order: Number(v.order) || 0
      };
    }).sort((a,b) => a.round - b.round || a.order - b.order);

    if (!ROWS.length) {
      return notice('아직 등록된 크리에이터가 없습니다',
        '섭외가 확정되는 대로 이 화면에 표시됩니다.');
    }

    gate.classList.add('hidden');
    started = true;
    renderPackage();
    start();
  } catch (err) {
    console.error(err);
    notice('불러오지 못했습니다',
      err.code === 'permission-denied'
        ? '이 캠페인에 접근할 권한이 없습니다.'
        : '잠시 후 다시 시도해 주세요. (' + esc(err.code || err.message) + ')');
  }
}

/* ───────── 패키지 스트립 ───────── */
function renderPackage(){
  if (!PKG || !PKG.name) return;
  const el = $('#pkg');
  const total = Number(PKG.creatorCount) || 0;
  const done  = ROWS.filter(r => r.status === 'published').length;
  const spec  = [
    PKG.rounds ? `${PKG.rounds}회차` : null,
    total ? `크리에이터 ${total}인` : null,
    PKG.note || null
  ].filter(Boolean).join(' · ');

  el.innerHTML = `
    <div>
      <div class="pk">Package</div>
      <div class="pname">${esc(PKG.name)}</div>
      ${spec ? `<div class="pspec" style="margin-top:5px">${esc(spec)}</div>` : ''}
    </div>
    ${total ? `<div class="prog">
      <div class="pk">업로드 진행</div>
      <div class="pnum">${done} <small>/ ${total}편</small></div>
      <div class="ptrack"><div class="pfill" style="width:${Math.min(100, total ? done/total*100 : 0)}%"></div></div>
    </div>` : ''}`;
  el.classList.remove('hidden');
}

function start(){
const ROUNDS = [...new Set(ROWS.map(r=>r.round))].sort((a,b)=>a-b);

const COLS = [
  {k:'round',     lb:'회차'},
  {k:'handle',    lb:'크리에이터'},
  {k:'followers', lb:'팔로워', r:true, sort:true},
  {k:'platform',  lb:'플랫폼'},
  {k:'status',    lb:'상태'},
  {k:'visit',     lb:'방문일'},
  {k:'post',      lb:'업로드일'},
  {k:'views',     lb:'조회수', r:true, sort:true},
  {k:'url',       lb:'콘텐츠'},
];
const onCols = () => COLS.filter(c=>CONFIG.cols[c.k]!==false);

document.getElementById('h1').textContent = META.title || '';
document.getElementById('meta').innerHTML = [
  ['Brand',META.brand],['Campaign',META.campaign],['Period',META.period],
  ['Platform',META.platform],['Manager',META.manager]
].filter(x=>x[1]).map(([k,v])=>
  `<div class="m"><div class="k">${k}</div><div class="v${k==='Period'?' mono':''}">${v}</div></div>`).join('');

if(!CONFIG.pipeline) document.getElementById('pipeCard').classList.add('hidden');
if(!CONFIG.rounds) document.getElementById('mRound').classList.add('hidden');
if(!CONFIG.dates)  document.getElementById('mDate').classList.add('hidden');
if(!CONFIG.rounds && !CONFIG.dates) document.querySelector('.scope').classList.add('hidden');

/* state */
let mode = CONFIG.rounds ? 'round' : 'date';
let round='all', from=null, to=null, status='all';
let sortKey='views', sortDir=-1;
const vv = ROWS.filter(r=>r.views).map(r=>r.views);
const maxViews = vv.length ? Math.max(...vv) : 1;

/* build round chips */
(function(){
  const c=document.getElementById('rounds');
  const mk=(v,label,on)=>{
    const b=document.createElement('button');
    b.className='chip'; b.type='button'; b.dataset.r=v;
    b.setAttribute('aria-pressed',String(on)); b.textContent=label;
    b.addEventListener('click',()=>{
      round=v;
      c.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      render();
    });
    c.appendChild(b);
  };
  mk('all','전체 회차',true);
  ROUNDS.forEach(r=>mk(String(r), r+'차', false));
})();

/* date bounds */
(function(){
  const ds=ROWS.flatMap(r=>[r.visit,r.post]).filter(Boolean).sort();
  if(!ds.length) return;
  document.getElementById('from').min=ds[0];
  document.getElementById('to').max=ds[ds.length-1];
})();

function setMode(m){
  mode=m;
  document.getElementById('mRound').setAttribute('aria-pressed',String(m==='round'));
  document.getElementById('mDate').setAttribute('aria-pressed',String(m==='date'));
  document.getElementById('rounds').classList.toggle('hidden', m!=='round');
  document.getElementById('dates').classList.toggle('hidden', m!=='date');
  document.getElementById('scopeLb').textContent = m==='round' ? 'Round' : 'Date range';
  render();
}
document.getElementById('mRound').addEventListener('click',()=>setMode('round'));
document.getElementById('mDate').addEventListener('click',()=>setMode('date'));
document.getElementById('from').addEventListener('change',e=>{from=e.target.value||null;render();});
document.getElementById('to').addEventListener('change',e=>{to=e.target.value||null;render();});
document.getElementById('resetDate').addEventListener('click',()=>{
  from=to=null;
  document.getElementById('from').value='';
  document.getElementById('to').value='';
  render();
});

document.querySelectorAll('#statusFilters .chip').forEach(b=>{
  b.addEventListener('click',()=>{
    status=b.dataset.f;
    document.querySelectorAll('#statusFilters .chip').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    render();
  });
});
document.getElementById('theme').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark?'light':'dark');
});

/* scope = 회차별 OR 기간별 (기간별은 회차를 무시합니다) */
function inScope(r){
  if(mode==='round') return round==='all' || String(r.round)===round;
  const d = r.post || r.visit;
  if(!d) return !from && !to;
  if(from && d < from) return false;
  if(to && d > to) return false;
  return true;
}

function render(){
  const scoped = ROWS.filter(inScope);
  ROWS.forEach(r=>{ if(r.masked===undefined) r.masked = !String(r.handle||'').startsWith('@'); });
  const rows = scoped
    .filter(r=> status==='all' || r.status===status)
    .slice()
    .sort((a,b)=>{
      const av=a[sortKey], bv=b[sortKey];
      if(av==null && bv==null) return 0;
      if(av==null) return 1;
      if(bv==null) return -1;
      return (av-bv)*sortDir;
    });

  /* KPI */
  const pub = scoped.filter(r=>r.status==='published');
  const visited = scoped.filter(r=>r.status==='published'||r.status==='visited');
  const sum = pub.reduce((a,r)=>a+r.views,0);
  const scopeName = mode==='round'
    ? (round==='all' ? '전체 회차' : round+'차')
    : (from||to ? `${md(from)||'처음'} ~ ${md(to)||'현재'}` : '전체 기간');

  const K = {
    creators:  ['대상 크리에이터', `${scoped.length}<small>명</small>`, scopeName],
    visited:   ['방문 완료', `${visited.length}<small>명</small>`, `잔여 ${scoped.length-visited.length}명 일정 조율`],
    published: ['업로드 완료', `${pub.length}<small>편</small>`, `${visited.length-pub.length}편 업로드 대기`],
    views:     ['누적 조회수', pub.length?fmt(sum):'—', `업로드 ${pub.length}편 합산`],
    avg:       ['평균 조회수', pub.length?fmt(Math.round(sum/pub.length)):'—', '콘텐츠 1편 기준'],
  };
  const onK = Object.keys(K).filter(k=>CONFIG.kpis[k]!==false);
  const kpiEl = document.getElementById('kpis');
  kpiEl.style.gridTemplateColumns = `repeat(${Math.max(1,onK.length)},1fr)`;
  kpiEl.innerHTML = onK.map(k=>{
    const [lb,v,s2]=K[k];
    return `<div class="kpi${k==='views'?' hero':''}"><div class="k">${lb}</div><div class="v num">${v}</div><div class="s">${s2}</div></div>`;
  }).join('');

  /* pipeline */
  const pipe=document.getElementById('pipe'), lg=document.getElementById('plegend');
  pipe.innerHTML=''; lg.innerHTML='';
  document.getElementById('pipeHint').textContent = `${scopeName} · ${scoped.length}명의 현재 단계입니다.`;
  STAGES.forEach(s=>{
    const n = scoped.filter(r=>r.status===s.key).length;
    if(n>0){
      const d=document.createElement('div');
      d.className='seg2';
      d.style.cssText=`flex:${n} 0 0;background:${s.color};color:${s.ink}`;
      d.innerHTML=`<span>${n}</span>`;
      d.title=`${s.label} ${n}명`;
      pipe.appendChild(d);
    }
    const li=document.createElement('div');
    li.className='li';
    li.innerHTML=`<span class="sw" style="background:${s.color}"></span>${s.label} <b>${n}</b>`;
    lg.appendChild(li);
  });

  /* table */
  const cols = onCols();
  document.getElementById('thead').innerHTML = '<tr>'+cols.map(c=>{
    const cls = (c.sort?'sortable ':'')+(c.r?'r':'');
    const arw = c.sort ? ` <span class="arw">${sortKey===c.k?(sortDir<0?'↓':'↑'):'↕'}</span>` : '';
    const as  = (c.sort&&sortKey===c.k) ? ` aria-sort="${sortDir<0?'descending':'ascending'}"` : '';
    return `<th class="${cls}"${c.sort?` data-s="${c.k}"`:''}${as}>${c.lb}${arw}</th>`;
  }).join('')+'</tr>';
  document.getElementById('thead').querySelectorAll('th.sortable').forEach(th=>{
    th.addEventListener('click',()=>{
      const k=th.dataset.s;
      if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir=-1;}
      render();
    });
  });

  const cell = (r,k)=>{
    const s2=STAGE[r.status];
    switch(k){
      case 'round': return `<td><span class="rd">${r.round}차</span></td>`;
      case 'handle': return `<td><span class="handle${r.masked?' masked':''}">${r.handle}</span></td>`;
      case 'followers': return `<td class="r">${r.followers?`<span class="num">${fmt(r.followers)}</span>`:'<span class="dash">—</span>'}</td>`;
      case 'platform': return `<td><span class="plat">${r.platform}</span></td>`;
      case 'status': return `<td><span class="st"><span class="i" style="background:${s2.color}"></span>${s2.label}</span></td>`;
      case 'visit': return `<td class="mono">${md(r.visit) ?? '<span class="dash">—</span>'}</td>`;
      case 'post': return `<td class="mono">${md(r.post) ?? '<span class="dash">—</span>'}</td>`;
      case 'views': {
        const bar = r.views ? Math.max(4, Math.round(r.views/maxViews*116)) : 0;
        return `<td class="r">${r.views?`<span class="viewcell" title="${r.views.toLocaleString()} views"><span class="vbar" style="width:${bar}px"></span><span class="vnum">${fmt(r.views)}</span></span>`:'<span class="dash">—</span>'}</td>`;
      }
      case 'url': return `<td>${r.url?`<a class="link" href="${r.url}">열기 →</a>`:'<span class="dash">—</span>'}</td>`;
    }
    return '<td></td>';
  };

  document.getElementById('tbody').innerHTML = rows.length
    ? rows.map(r=>'<tr>'+cols.map(c=>cell(r,c.k)).join('')+'</tr>').join('')
    : `<tr><td colspan="${cols.length}" class="empty">선택한 조건에 해당하는 크리에이터가 없습니다.</td></tr>`;

  document.getElementById('count').textContent = `${rows.length}명 표시 · ${scopeName} ${scoped.length}명`;
}

  render();
}

</script>
</body>
</html>

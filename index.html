<style>
/* ══════════════════════════════════════════════════════════════
   8labs.kr — 메인
   명함과 같은 흑백 체계. 단일 화면으로 고정합니다.
   ══════════════════════════════════════════════════════════════ */
:root{
  --ink:#0B0A0A;
  --ink-2:#141212;
  --tx:#F6F4F3;
  --dim:#8C8482;
  --faint:#5A5351;
  --rule:#241F1F;
  --red:#C0202E;
  --f:'Archivo','Noto Sans KR',system-ui,sans-serif;
  --fk:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--tx);
  font-family:var(--f);font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;word-break:keep-all;
  display:flex;flex-direction:column;min-height:100dvh;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:1px solid var(--tx);outline-offset:4px}

/* 아주 옅은 중심 광원 — 명함 사진의 조명을 흉내냅니다 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 90% at 50% 38%, rgba(255,255,255,.055), transparent 62%);
}

.shell{position:relative;z-index:1;width:100%;max-width:1080px;
  margin-inline:auto;padding-inline:clamp(24px,6vw,64px)}

/* ───────── 상단 ───────── */
.top{padding-top:clamp(26px,4vh,40px)}
.top .mark{font-family:var(--fm);font-size:10.5px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--faint)}

/* ───────── 중앙 ───────── */
main{flex:1;display:flex;align-items:center;justify-content:center;
  padding-block:clamp(36px,8vh,80px)}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;
  animation:rise .9s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.center{animation:none}}

.logo{width:clamp(230px,34vw,340px);height:auto}
.tag{margin-top:clamp(20px,3vh,28px);font-family:var(--fm);
  font-size:clamp(10px,1.2vw,11.5px);letter-spacing:.42em;
  text-transform:uppercase;color:var(--dim);padding-left:.42em}

.rule{width:clamp(44px,8vw,72px);height:1px;background:var(--rule);
  margin:clamp(26px,4vh,40px) 0}

.line{font-family:var(--fk);font-weight:500;color:var(--dim);
  font-size:clamp(14px,1.5vw,16px);line-height:1.9;max-width:30ch}
.line b{color:var(--tx);font-weight:700}

/* ───────── 진입 ───────── */
.enter{margin-top:clamp(30px,5vh,46px);display:inline-flex;align-items:center;gap:14px;
  border:1px solid var(--rule);padding:15px 22px;transition:.22s ease;background:transparent}
.enter:hover{border-color:var(--tx)}
.enter .en{font-family:var(--fm);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase}
.enter .ko{font-family:var(--fk);font-size:13.5px;color:var(--dim);transition:color .22s}
.enter:hover .ko{color:var(--tx)}
.enter .ar{color:var(--red);transition:transform .22s}
.enter:hover .ar{transform:translateX(5px)}
@media (max-width:460px){
  .enter{flex-direction:column;gap:7px;width:100%;padding:16px}
}

/* ───────── 하단 ───────── */
.foot{padding-bottom:clamp(24px,4vh,36px)}
.foot-in{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  padding-top:18px;border-top:1px solid var(--rule);
  font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;color:var(--faint)}
.foot-in .sp{margin-left:auto}
@media (max-width:520px){.foot-in .sp{margin-left:0}}
</style>
</head>
